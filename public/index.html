<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hiring Desk</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centred working column; candidate side is a stepped test with a sticky timer bar, HR side is a list → scoring sheet. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EBEEF4; --ink:#141A2B; --muted:#5A6378; --line:#D9DEE8;
  --accent:#2F46C8; --accent-ink:#FFFFFF; --accent-soft:#E6E9FB;
  --good:#1E7F48; --good-soft:#E1F2E8; --warn:#9A5B00; --warn-soft:#FBEFD9; --bad:#BC342C; --bad-soft:#FBE5E3;
  --display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px; color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E121D; --surface:#161B29; --sunk:#1D2334; --ink:#E7EAF2; --muted:#9AA3B8; --line:#2B3248;
  --accent:#8E9EFF; --accent-ink:#0E121D; --accent-soft:#232B52;
  --good:#5CCB8B; --good-soft:#163122; --warn:#F0B451; --warn-soft:#33270F; --bad:#FF8B82; --bad-soft:#3A1A18;
  color-scheme:dark;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--body);}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:880px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:clamp(28px,5vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:22px;font-weight:700}
h3{font-size:17px;font-weight:600}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:16px;margin-bottom:20px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;font-size:18px}
.logo-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--mono);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.sunk{background:var(--sunk);border-radius:8px;padding:14px 16px}
.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.split > *{min-width:0}
button{font:inherit;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px}
input[type=text],input[type=tel],input[type=email],input[type=password],input[type=search],select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px;width:100%}
textarea{min-height:120px;resize:vertical;line-height:1.5}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.err{color:var(--bad);font-size:14px;font-weight:500}
.note{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0;font-size:14px}
.note.info{border-color:var(--accent);background:var(--accent-soft)}
.note.bad{border-color:var(--bad);background:var(--bad-soft)}
.door{display:flex;flex-direction:column;gap:14px;justify-content:space-between}
.door .meta{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.door.cand{border-top:4px solid var(--accent)}
.door.hr{border-top:4px solid var(--ink)}
.testbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.step{font-size:12px;font-weight:600;padding:4px 10px;border-radius:99px;background:var(--sunk);color:var(--muted)}
.step.on{background:var(--accent);color:var(--accent-ink)}
.step.done{background:var(--accent-soft);color:var(--accent)}
.timers{display:flex;gap:8px;align-items:center}
.timer{display:flex;flex-direction:column;align-items:center;font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;padding:2px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--line);line-height:1.2}
.timer small{font-family:var(--body);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.timer.low{color:var(--bad);border-color:var(--bad)}
.q{display:flex;flex-direction:column;gap:10px;padding:16px 0;border:none;border-top:1px solid var(--line);margin:0;padding-inline:0}
.q-head{display:flex;gap:10px;padding:0}
.q-n{font-family:var(--mono);color:var(--muted);min-width:24px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px;padding-left:34px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;min-width:0}
.opt:hover{border-color:var(--muted)}
.opt input{margin-top:3px;accent-color:var(--accent)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt span{min-width:0;overflow-wrap:anywhere}
.k{font-family:var(--mono);font-weight:600;color:var(--muted)}
ol.tasks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:14px;counter-reset:t}
ol.tasks > li{counter-increment:t;display:grid;grid-template-columns:36px 1fr;gap:10px;align-items:start}
ol.tasks > li::before{content:counter(t);font-family:var(--mono);font-weight:600;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
ol.tasks > li > div{min-width:0}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.passage{font-size:17px;line-height:1.7;user-select:none;-webkit-user-select:none}
.typebox{font-family:var(--mono);font-size:16px;min-height:160px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.toolbar > input{flex:1 1 220px;width:auto}
.toolbar > select{flex:0 1 180px;width:auto}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600;min-height:34px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cand-list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.cand-row{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:14px 16px;border:none;border-top:1px solid var(--line);text-align:left;background:none;color:inherit;width:100%}
.cand-row:first-child{border-top:none}
.cand-row:hover{background:var(--sunk)}
.cand-row .name{font-weight:600;font-size:16px}
.cand-row .sub{font-size:13px;color:var(--muted)}
.cand-row .score{font-family:var(--mono);font-size:20px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.prog{background:var(--sunk);color:var(--muted)}
.pill.wait{background:var(--warn-soft);color:var(--warn)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.counts{display:flex;gap:20px;flex-wrap:wrap}
.counts div{display:flex;flex-direction:column}
.counts b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.score-card{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.big{font-family:var(--display);font-size:64px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:22px;color:var(--muted);font-weight:600}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:120px 1fr 64px;gap:10px;align-items:center;font-size:13px}
.bar .track{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar .fill{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar .v{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.verdict{padding:12px 14px;border-radius:8px;font-weight:600}
.verdict.good{background:var(--good-soft);color:var(--good)}
.verdict.mid{background:var(--accent-soft);color:var(--accent)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.pend{background:var(--sunk);color:var(--muted)}
.score-line{display:grid;grid-template-columns:1fr auto;gap:8px 16px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.score-line:first-child{border-top:none}
.score-line > div{min-width:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:none;border-left:1px solid var(--line);background:none;color:var(--ink);min-width:44px;min-height:40px;font-family:var(--mono);font-weight:600}
.seg button:first-child{border-left:none}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.answer{background:var(--sunk);border-radius:6px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px}
.answer.empty{color:var(--muted);font-style:italic}
.expect{font-size:13px;color:var(--good)}
.part-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.part-head .pts{font-family:var(--mono);font-size:18px;font-weight:600}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kv div{display:flex;flex-direction:column;min-width:0}
.kv b{font-weight:600;overflow-wrap:anywhere}
.savebar{position:sticky;bottom:0;padding-block:12px calc(12px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;z-index:4}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:14px}
.pin{font-family:var(--mono);letter-spacing:.4em;font-size:22px;text-align:center}
.center{max-width:400px;margin:40px auto 0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (max-width:560px){
  .opts{padding-left:0}
  .score-card{grid-template-columns:1fr}
  .bar{grid-template-columns:96px 1fr 56px}
  .big{font-size:52px}
  .score-line{grid-template-columns:1fr}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">Loading…</p></div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Test content (answer keys stay on the server) ---------- */
const QUIZ = [
 {"s": "Basic", "q": "Copy selected text", "o": ["Ctrl+C", "Ctrl+V", "Ctrl+P", "Ctrl+X"]},
 {"s": "Basic", "q": "Undo your last mistake", "o": ["Ctrl+D", "Ctrl+Y", "Ctrl+U", "Ctrl+Z"]},
 {"s": "Basic", "q": "Save a file", "o": ["Ctrl+W", "Ctrl+S", "Ctrl+N", "Ctrl+O"]},
 {"s": "Basic", "q": "Open the Print window", "o": ["Ctrl+R", "Ctrl+T", "Ctrl+P", "Ctrl+I"]},
 {"s": "Basic", "q": "A file you download usually goes to", "o": ["Recycle Bin", "Documents", "Downloads folder", "Desktop"]},
 {"s": "Basic", "q": "Which one is an image file?", "o": ["product.jpg", "notes.docx", "invoice.pdf", "orders.xlsx"]},
 {"s": "Basic", "q": "When you delete a file normally, where does it go first?", "o": ["Desktop", "It is gone forever", "Downloads folder", "Recycle Bin (Trash on a Mac)"]},
 {"s": "Basic", "q": "To send a file with an email, you add it as", "o": ["Subject", "Attachment", "CC", "Signature"]},
 {"s": "Basic", "q": "Which program is best for writing a letter?", "o": ["Paint", "Calculator", "Microsoft Excel", "Microsoft Word"]},
 {"s": "Medium", "q": "Find a word on a web page or in a document", "o": ["Ctrl+E", "Ctrl+F", "Ctrl+H", "Ctrl+G"]},
 {"s": "Medium", "q": "Switch between open windows", "o": ["Ctrl+Alt+Del", "Windows+L", "Alt+Tab", "Shift+Tab"]},
 {"s": "Medium", "q": "Take a screenshot of part of the screen", "o": ["Windows+Shift+S", "Alt+F4", "Ctrl+P", "Ctrl+Shift+S"]},
 {"s": "Medium", "q": "In Word, to change one word to another everywhere in the document, use", "o": ["Ctrl+R", "Ctrl+K", "Ctrl+F (Find)", "Ctrl+H (Find and Replace)"]},
 {"s": "Medium", "q": "In Excel, cell B3 means", "o": ["Column 3, Row B", "Column B, Row 3", "Sheet B, Page 3", "Box 3 of sheet B"]},
 {"s": "Medium", "q": "Formula to add cells A1 to A10", "o": ["=SUM(A1:A10)", "=A1-A10", "=ADD(A1:A10)", "=TOTAL(A1+A10)"]},
 {"s": "Medium", "q": "To show only COD orders in a list, you use", "o": ["Bold", "Sort", "Filter", "Merge"]},
 {"s": "Medium", "q": "Which is the strongest password?", "o": ["password", "123456", "rahul1995", "Ship@Desk#2026"]},
 {"s": "Medium", "q": "In an email, CC means", "o": ["Customer Care", "A copy is sent to another person", "Close Copy", "Cancel"]},
 {"s": "Medium", "q": "Which file type is best for sending a final bill that should not be changed?", "o": [".docx", ".xlsx", ".pdf", ".txt"]},
 {"s": "Expert", "q": "An email from support@amaz0n-seller.co says your seller account is blocked and asks you to log in from a link. What should you do?", "o": ["The address is fake (a zero in place of the letter o): do not click, tell your manager", "It is safe if the Amazon logo is shown", "Reply and ask if it is real", "It is from Amazon, log in quickly"]},
 {"s": "Expert", "q": "A cell in Excel shows ##### instead of a number. Why?", "o": ["The file is damaged", "The number is negative", "The formula is wrong", "The column is too narrow to show the number"]},
 {"s": "Expert", "q": "You get a file named invoice.pdf.exe. What is it really?", "o": ["A PDF bill", "A program, which could be a virus", "An Excel file", "A picture"]},
 {"s": "Expert", "q": "What does Shift+Delete do to a file on Windows?", "o": ["Renames it", "Moves it to the Recycle Bin", "Deletes it for good, without the Recycle Bin", "Makes a copy"]},
 {"s": "Expert", "q": "In Excel, =A2*$B$1 is copied down to the rows below. What happens to $B$1?", "o": ["It changes to B2, B3 and so on", "It stays B1 in every row", "It becomes A1", "It shows an error"]},
 {"s": "Expert", "q": "Which Excel function finds a product's price from another sheet using its SKU code?", "o": ["VLOOKUP", "AVERAGE", "SUM", "COUNTIF"]},
 {"s": "Reasoning", "q": "What number comes next? 2, 6, 12, 20, 30, ?", "o": ["36", "40", "42", "44"]},
 {"s": "Reasoning", "q": "You start packing at 3:30 pm. Each order takes 2 minutes. You have 45 orders and the courier comes at 5:00 pm. Will all orders be ready?", "o": ["No, 15 minutes short", "Yes, with 30 minutes to spare", "No, 1 hour short", "Yes, ready exactly at 5:00 pm"]},
 {"s": "Reasoning", "q": "A courier charges Rs 45 for the first 500 g and Rs 40 for every extra 500 g or part of it. What is the charge for a 1.4 kg parcel?", "o": ["Rs 85", "Rs 112", "Rs 125", "Rs 165"]},
 {"s": "Reasoning", "q": "Out of 200 orders, 30 were returned. What percent were returned?", "o": ["3%", "15%", "20%", "30%"]},
 {"s": "Reasoning", "q": "Ravi packs more orders than Amit but fewer than Sunil. Neha packs more than Sunil. Who packs the most?", "o": ["Ravi", "Sunil", "Neha", "Amit"]},
];
const LETTERS = ["a","b","c","d"];
const TASKS = [
 {t:"Folder and image", d:"FOLDER", c:"Folder on Desktop with the right name; image downloaded (not a screenshot), renamed iphone15_glass.jpg, inside the folder"},
 {t:"Type and format in Word", d:"WORD", c:"Text typed correctly; NOTICE bold, centred, size 16; three lines as bullets; saved as notice_name.docx in the folder"},
 {t:"Find and Replace in Word", d:"REPLACE", c:"Used Ctrl+H (not retyping by hand); all 3 \"courier\" changed to \"Courier Partner\"; saved again"},
 {t:"Screenshot into Word", d:"SHOT", c:"Used Windows+Shift+S (or Cmd+Shift+4); picture pasted under the notice; document saved"},
 {t:"Print the notice", d:"PRINT", c:"Opened Print with Ctrl+P; Landscape; printed to PDF as notice_name.pdf in the folder (or one real copy if you asked)"},
 {t:"Excel sheet", d:"EXCEL", c:"Header bold; total uses =SUM and shows 1945; sorted 599 first; filter used and cleared; saved as orders_name.xlsx"},
 {t:"Send an email", d:"EMAIL", c:"Email arrived with the right subject, a message, and both the Word and Excel files attached"},
 {t:"Make a ZIP file", d:"ZIP", c:"ZIP of the whole folder made, sitting next to the folder, and it opens"},
];
const PASSAGE = "Dear customer, thank you for shopping with us. Your order for a tempered glass screen guard and a back cover has been packed and handed over to the courier today. You will receive a tracking number on WhatsApp within a few hours. Delivery usually takes three to five working days, but orders to small towns may take one or two days more. Please keep your phone switched on so the delivery partner can reach you. If you are not at home, you can ask a family member to collect the parcel. If the parcel looks damaged, take a photo before opening it and send it to us on WhatsApp. We will arrange a free replacement as soon as possible. For cash on delivery orders, please keep the exact amount ready. If you have any question about fitting the screen guard, watch the video link in the box or call our support team between 10 am and 7 pm. Have a great day.";
const SECTION_NAMES = {Basic:"Basic computer", Medium:"Medium", Expert:"Expert and tricky", Reasoning:"Reasoning"};
const REASONING_FROM = 25; /* questions 26 to 30 are reasoning */
const PHISHING_Q = 19;     /* question 20: the fake Amazon email */
const CUSTOMER_MSG = "Hello, I ordered a screen guard for Redmi Note 13 on Monday. Today is Friday and I still have not received it. The tracking shows \"out for delivery\" since yesterday. I need it urgently because my phone screen is cracked. Please help.";
const READ_Q = ["What did the customer order?","Since when has the tracking shown \"out for delivery\"?","Why does the customer need it urgently?"];
const RUBRIC = [
 {k:"greet", l:"Polite greeting and sorry for the delay", max:2},
 {k:"next", l:"Clear next step (check with courier, share update, give a time)", max:3},
 {k:"english", l:"Correct English: grammar and spelling", max:2},
 {k:"short", l:"Short and clear, 3 to 5 lines", max:2},
];
const POSTS = ["Listing","Shipping","Customer care","Other office post"];
const DECISIONS = ["Go to department test","Hire","Keep for future","Not ready for office post","Reject"];
/* Time limits in seconds: 9 + 10 + 2 + 4 = 25 minutes */
const LIMITS = {"c-p1":540, "c-p2":600, "c-p3":120, "c-p4":240};
const TEST_SECONDS = 1500;
/* Marks: quiz 30, computer tasks 40, typing 15, English 15 = 100 */
const MAX = {p1:30, p2:40, p3:15, p4:15};

/* ---------- Scoring shown to HR (the server re-checks when saving) ---------- */
function emptyHr(){ return {p2:Array(TASKS.length).fill(null), read:[null,null,null], reply:{greet:null,next:null,english:null,short:null}, decision:"", notes:""}; }
function totals(c, hr){
  hr = hr || c.hr || emptyHr();
  const p2arr = hr.p2||[], rd = hr.read||[], rp = hr.reply||{};
  const p1 = c.part1 ? c.part1.score : 0;
  const p2 = p2arr.reduce((s,v)=>s+(v||0),0);
  const p3 = c.part3 ? c.part3.marks : 0;
  const p4 = rd.reduce((s,v)=>s+(v||0),0) + RUBRIC.reduce((s,r)=>s+(rp[r.k]||0),0);
  const p2done = p2arr.length===TASKS.length && p2arr.every(v=>v!==null);
  const p4done = rd.length===3 && rd.every(v=>v!==null) && RUBRIC.every(r=>rp[r.k]!==null && rp[r.k]!==undefined);
  const complete = !!(c.part1 && c.part3 && c.part4) && p2done && p4done;
  const total = p1+p2+p3+p4;
  const p2fail = p2done && p2<20;
  let verdict, vclass;
  if(!complete){ verdict="Scoring not finished"; vclass="pend"; }
  else if(p2fail){ verdict="Reject for office posts: computer tasks below 20 out of 40"; vclass="bad"; }
  else if(total>=75){ verdict="Strong: go to the department test"; vclass="good"; }
  else if(total>=60){ verdict="Pass: go to the department test"; vclass="mid"; }
  else { verdict="Not ready for an office post (can be considered for Packing)"; vclass="bad"; }
  const rating = total>=85?5:total>=75?4:total>=60?3:total>=45?2:1;
  return {p1,p2,p3,p4,total,complete,p2fail,verdict,vclass,rating};
}

async function api(method, path, body, headers){
  let r;
  try{
    r = await fetch("/api/"+path, {method, headers:Object.assign({"content-type":"application/json"}, headers||{}), body: body?JSON.stringify(body):undefined});
  }catch(e){ const err=new Error("No internet connection. Check it and try again."); err.status=0; throw err; }
  let d={}; try{ d=await r.json(); }catch(e){}
  if(!r.ok){ const err=new Error(d.error||("Something went wrong (error "+r.status+").")); err.status=r.status; throw err; }
  return d;
}

function taskBody(t){

  if(t.d==="EMAIL"){

      ${c.part1?`<div class="kv">${Object.keys(SECTION_NAMES).map(sec=>{const idx=QUIZ.map((q,i)=>q.s===sec?i:-1).filter(i=>i>=0);const ok=idx.filter(i=>c.part1.answers[i]===key.quiz[i]).length;return `<div><span class="small muted">${SECTION_NAMES[sec]}</span><b class="mono">${ok}/${idx.length}</b></div>`;}).join("")}</div>`:""}
      ${c.part1 ? (wrong.length ? `<p class="muted small">1 mark per question, marked automatically. ${wrong.length} wrong or unanswered:</p><div class="tbl-wrap"><table><thead><tr><th>Q</th><th>Question</th><th>Their answer</th><th>Correct</th></tr></thead><tbody>${wrong.map(x=>`<tr><td class="mono">${x.i+1}</td><td>${esc(x.q.q)}</td><td>${x.a==null?`<span class="muted">No answer</span>`:esc(LETTERS[x.a]+") "+x.q.o[x.a])}</td><td>${x.k==null?"":esc(LETTERS[x.k]+") "+x.q.o[x.k])}</td></tr>`).join("")}</tbody></table></div>` : `<p class="muted small">All 30 correct.</p>`)+(c.part1.timedOut?`<p class="small muted">Time ran out before they pressed submit.</p>`:"") : `<p class="muted">Not done yet.</p>`}
      ${c.part1&&c.part1.answers[PHISHING_Q]!==key.quiz[PHISHING_Q]?`<div class="note">Question ${PHISHING_Q+1} (fake Amazon email) was wrong: this candidate might click a fake login link. Ask about it in the interview.</div>`:""}</div>

    <div class="panel stack"><div class="part-head"><h2>Part 2 · Computer tasks</h2><span class="pts">${t.p2}/${MAX.p2}</span></div>
      <p class="small muted">Give <b>5</b> if done alone and correctly, <b>3</b> with one hint or very slowly, <b>0</b> if they could not do it.${c.part2?` They took <b class="mono">${c.part2.minutes} min</b>${c.part2.timedOut?" (time ran out)":""}.`:""}</p>
      <div>${TASKS.map((tk,i)=>`<div class="score-line"><div><b>${i+1}. ${tk.t}</b><div class="small muted">${esc(tk.c)}</div></div>${seg("p2."+i,[5,3,0],d.p2[i])}</div>`).join("")}</div>
      ${t.p2fail?`<div class="note bad">Below 20 out of 40: reject for office posts, whatever the total.</div>`:""}</div>

    <div class="panel stack"><div class="part-head"><h2>Part 3 · Typing</h2><span class="pts">${t.p3}/${MAX.p3}</span></div>
      ${c.part3?`<div class="kv"><div><span class="small muted">Speed</span><b class="mono" style="font-size:20px">${c.part3.wpm} WPM</b></div><div><span class="small muted">Mistakes</span><b class="mono">${c.part3.mistakes}</b></div><div><span class="small muted">Target</span><b>25 WPM or more</b></div></div>
      ${c.part3.mistakes>5?`<p class="small muted">More than 5 mistakes, so 3 marks were taken off.</p>`:""}
      <details><summary>Show what they typed</summary><div class="answer mono" style="margin-top:8px">${esc(c.part3.typed)||"(nothing typed)"}</div></details>`:`<p class="muted">Not done yet.</p>`}</div>

    <div class="panel stack"><div class="part-head"><h2>Part 4 · English</h2><span class="pts">${t.p4}/${MAX.p4}</span></div>
      ${c.part4?`<h3>A. Reading (2 marks each)</h3>
      <div>${READ_Q.map((q,i)=>`<div class="score-line"><div class="stack-s" style="gap:4px"><b>${i+1}. ${esc(q)}</b><div class="answer ${c.part4.read[i]?"":"empty"}">${esc(c.part4.read[i])||"No answer"}</div><span class="expect">Expected: ${esc(key.read[i]||"")}</span></div>${seg("read."+i,[2,1,0],d.read[i])}</div>`).join("")}</div>
      <h3>B. Written reply</h3><div class="answer ${c.part4.reply?"":"empty"}">${esc(c.part4.reply)||"No reply written"}</div>
      <div>${RUBRIC.map(r=>`<div class="score-line"><div><b>${esc(r.l)}</b><div class="small muted">Up to ${r.max} marks</div></div>${seg("reply."+r.k,Array.from({length:r.max+1},(_,i)=>r.max-i),d.reply[r.k])}</div>`).join("")}</div>`:`<p class="muted">Not done yet.</p>`}</div>

    <div class="panel stack"><h2>Your decision</h2>
      <label class="f">Decision<select id="h-dec"><option value="">Not decided</option>${DECISIONS.map(x=>`<option ${d.decision===x?"selected":""}>${x}</option>`).join("")}</select></label>
      <label class="f">Notes from the interview<textarea id="h-notes" maxlength="3000" placeholder="Attitude, good habits you noticed, salary expected, joining date…">${esc(d.notes)}</textarea></label>
      ${S.confirmDelete?`<div class="note bad row between"><span>Delete ${esc(c.name)} and all their answers for good?</span><span class="row"><button class="btn" data-act="del-cancel">Keep</button><button class="btn danger" data-act="del-yes">Delete</button></span></div>`:`<div><button class="btn ghost" data-act="del">Delete this candidate</button></div>`}</div>
    <div class="savebar"><span class="small ${S.dirty?"":"muted"}">${S.dirty?"<b>Unsaved changes</b>":(c.scoredAt?"Saved "+fmtDate(c.scoredAt):"Nothing saved yet")}</span><button class="btn primary" data-act="save-hr" ${S.dirty&&!S.busy?"":"disabled"}>Save scores</button></div>
  </div>`;
}
function viewHrSettings(){
  return hrBar() + `<div class="stack" style="max-width:560px">
    <button class="btn ghost" data-act="hr-list" style="align-self:flex-start">← All candidates</button>
    <h1>Settings</h1>
    <form id="f-tasks" class="panel stack" novalidate><h3>Shown to candidates in Part 2</h3>
      <label class="f">Your email for Task 7 (candidate sends the Word and Excel files here)<input type="email" id="s-email" value="${esc(S.cfg.taskEmail||"")}" maxlength="120"></label>
      <button class="btn primary" type="submit">Save</button></form>
    <div class="panel stack-s"><h3>Change the HR PIN</h3><p class="muted small">In Netlify, open your site, go to Site configuration, then Environment variables. Edit <b class="mono">HR_PIN</b>, then go to Deploys and press Trigger deploy.</p></div></div>`;
}

/* ---------- Timers ---------- */
function partEnd(){ const a=S.active; if(!a) return Date.now(); return Math.min(a.partStart + LIMITS[S.view]*1000, a.testStart + TEST_SECONDS*1000); }
function setTimer(id, left, lowAt){
  const el=$("#"+id); if(!el) return;
  el.querySelector("span").textContent=fmtTime(left); el.classList.toggle("low", left<=lowAt);
}
function tick(){
  if(!LIMITS[S.view] || !S.active) return;
  const now=Date.now();
  const left=(partEnd()-now)/1000, total=(S.active.testStart+TEST_SECONDS*1000-now)/1000;
  setTimer("t-part", left, S.view==="c-p3"?10:30); setTimer("t-total", total, 60);
  if(left<=0 && !S.timing){
    S.timing=true;
    if(S.view==="c-p1") submitP1(true);
    else if(S.view==="c-p2") submitP2(true);
    else if(S.view==="c-p3") finishP3();
    else if(S.view==="c-p4") submitP4(true);
  }
}

/* ---------- Candidate actions ---------- */
function saveActive(){ lsSet("hd-active", S.active); }
function startPart(step){ S.active.step=step; S.active.partStart=Date.now(); S.timing=false; S.busy=false; saveActive(); go(step); }
async function retrying(fn){
  for(let i=0;i<3;i++){ try{ return await fn(); }catch(e){ if(e.status && e.status<500) throw e; if(i===2) throw e; await new Promise(r=>setTimeout(r,1500)); } }
}
async function startCandidate(){
  const name=$("#d-name").value.trim(), phone=$("#d-phone").value.trim(), email=$("#d-email").value.trim(), post=$("#d-post").value;
  const err=$("#d-err");
  if(!name||!phone||!post){ err.textContent="Please fill your name, phone number and the post."; err.hidden=false; return; }
  if(phone.replace(/\D/g,"").length<10){ err.textContent="Please enter a 10-digit phone number."; err.hidden=false; return; }
  $("#d-submit").disabled=true;
  try{
    const r=await api("POST","candidates",{name,phone,email,post});
    S.active={id:r.id,token:r.token,code:r.code,name,testStart:Date.now(),p1:Array(QUIZ.length).fill(null)};
    S.p1=S.active.p1;
    startPart("c-p1");
  }catch(e){ $("#d-submit").disabled=false; err.textContent=e.message; err.hidden=false; }
}
async function sendPart(body){
  try{ await retrying(()=>candApi("PATCH", body)); return true; }
  catch(e){ if(e.status===409){ finishLocal(); return false; } S.busy=false; S.timing=false; toast(e.message); keepScroll(); return false; }
}
async function submitP1(timedOut){
  S.busy=true; keepScroll();
  if(await sendPart({part:"p1",answers:S.p1,timedOut:!!timedOut})){ delete S.active.p1; startPart("c-p2"); }
}
async function submitP2(timedOut){
  S.busy=true; keepScroll();
  if(await sendPart({part:"p2",timedOut:!!timedOut})){ S.p3={typed:""}; startPart("c-p3"); }
}
async function finishP3(){
  const ta=$("#typebox"); if(ta){ S.p3.typed=ta.value; ta.disabled=true; }
  if(await sendPart({part:"p3",typed:S.p3.typed||""})){ S.p4={read:["","",""],reply:""}; startPart("c-p4"); }
  else { S.timing=false; S.active.partStart = Date.now() - LIMITS["c-p3"]*1000 + 3000; }
}
function readP4(){ if($("#reply")) S.p4={read:[0,1,2].map(i=>$("#r"+i).value.trim()),reply:$("#reply").value.trim()}; }
async function submitP4(timedOut){
  readP4(); S.busy=true;
  if(!timedOut) keepScroll();
  if(await sendPart({part:"p4",read:S.p4.read,reply:S.p4.reply,timedOut:!!timedOut})) finishLocal();
}
function finishLocal(){ S.done={name:S.active.name,code:S.active.code}; S.active=null; saveActive(); S.busy=false; S.timing=false; go("c-done"); }
function resume(){
  const a=S.active; if(!a) return;
  if(a.step==="c-p1"){ S.p1=a.p1||Array(QUIZ.length).fill(null); }
  if(a.step==="c-p3"){ S.p3={typed:""}; }
  if(a.step==="c-p4"){ S.p4={read:["","",""],reply:""}; }
  S.timing=false; S.busy=false; go(a.step||"c-p1");
}

/* ---------- HR actions ---------- */
async function loadList(){
  try{
    const r=await hrApi("GET","candidates");
    S.list=r.candidates; S.key=r.key; S.listLoaded=true;
    if(S.view==="hr-list") renderRows();
    else if(S.view==="hr-detail" && !S.dirty) keepScroll();
  }catch(e){ if(e.status===401){ lockHr(); toast("Please enter the PIN again."); } else toast(e.message); }
}
async function pinSubmit(){
  const p=$("#pin1").value.trim();
  if(!p){ S.pinErr="Enter the PIN."; render(); return; }
  S.busy=true; S.pin=p; render();
  try{ await hrApi("POST","check"); ssSet("hd-pin",p); S.pinErr=""; S.busy=false; S.listLoaded=false; go("hr-list"); loadList(); }
  catch(e){ S.pin=null; S.busy=false; S.pinErr=e.message; render(); }
}
function lockHr(){ S.pin=null; ssSet("hd-pin",null); S.list=[]; S.key=null; S.listLoaded=false; S.dirty=false; go("home"); }
function openDetail(id){
  const c=S.list.find(x=>x.id===id); if(!c) return;
  S.detailId=id; S.draft=Object.assign(emptyHr(), clone(c.hr||{}));
  S.dirty=false; S.confirmDelete=false; go("hr-detail");
}
function setDraft(path,val){
  const [k,sub]=path.split(".");
  if(k==="reply") S.draft.reply[sub]=val; else S.draft[k][+sub]=val;
  S.dirty=true; keepScroll();
}
async function saveHr(){
  S.busy=true; keepScroll();
  try{
    const r=await hrApi("PUT","candidates/"+S.detailId,{hr:S.draft});
    const i=S.list.findIndex(x=>x.id===S.detailId); if(i>=0) S.list[i]=r.candidate;
    S.dirty=false; toast("Scores saved");
  }catch(e){ toast(e.message); }
  S.busy=false; keepScroll();
}
async function delCand(){
  try{ await hrApi("DELETE","candidates/"+S.detailId); S.list=S.list.filter(x=>x.id!==S.detailId); S.dirty=false; toast("Candidate deleted"); go("hr-list"); }
  catch(e){ toast(e.message); }
}
function exportCsv(){
  const head=["Code","Name","Phone","Email","Post","Started","Status","Quiz /30","Computer tasks /40","Typing /15","English /15","Total /100","Typing WPM","Result","Decision","Notes"];
  const rows=S.list.map(c=>{const t=totals(c);const h=c.hr||{};
    return [c.code,c.name,c.phone,c.email,c.post,fmtDate(c.createdAt),c.status,t.p1,t.p2,t.p3,t.p4,t.total,c.part3?c.part3.wpm:"",t.verdict,h.decision||"",h.notes||""];});
  const csv=[head,...rows].map(r=>r.map(v=>{v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;}).join(",")).join("\n");
  const url=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));
  const a=document.createElement("a"); a.href=url; a.download="candidates-"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),2000);
}
function leaveDetail(b, then){
  if(S.dirty && !b.dataset.sure){ toast("You have unsaved scores. Press again to leave without saving."); b.dataset.sure="1"; return; }
  S.dirty=false; then();
}

/* ---------- Events ---------- */
document.addEventListener("click", e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const a=b.dataset.act;
  if(a==="home") go("home");
  else if(a==="start") go("c-details");
  else if(a==="resume") resume();
  else if(a==="to-hr"){ if(S.pin){ S.listLoaded=false; go("hr-list"); loadList(); } else { S.pinErr=""; go("pin"); } }
  else if(a==="submit-p1"){ const un=S.p1.filter(v=>v==null).length; if(un>0&&!S.confirmSubmit){ S.confirmSubmit=true; keepScroll(); return; } S.timing=true; submitP1(false); }
  else if(a==="submit-p2"){ if(!S.confirmSubmit){ S.confirmSubmit=true; keepScroll(); return; } S.timing=true; submitP2(false); }
  else if(a==="submit-p4"){ if(!S.confirmSubmit){ readP4(); S.confirmSubmit=true; keepScroll(); return; } S.timing=true; submitP4(false); }
  else if(a==="lock") leaveDetail(b, lockHr);
  else if(a==="refresh") loadList();
  else if(a==="hr-list") leaveDetail(b, ()=>{ go("hr-list"); });
  else if(a==="hr-settings") leaveDetail(b, ()=>go("hr-settings"));
  else if(a==="fstatus"){ S.filter.status=b.dataset.v; document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.v===S.filter.status)); renderRows(); }
  else if(a==="open") openDetail(b.dataset.id);
  else if(a==="setv"){ const v=+b.dataset.v; const [k,sub]=b.dataset.path.split("."); const cur=k==="reply"?S.draft.reply[sub]:S.draft[k][+sub]; setDraft(b.dataset.path, cur===v?null:v); }
  else if(a==="save-hr") saveHr();
  else if(a==="del"){ S.confirmDelete=true; keepScroll(); }
  else if(a==="del-cancel"){ S.confirmDelete=false; keepScroll(); }
  else if(a==="del-yes") delCand();
  else if(a==="csv") exportCsv();
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.name && /^q\d+$/.test(t.name)){
    const i=+t.name.slice(1); S.p1[i]=+t.value;
    if(S.active){ S.active.p1=S.p1; saveActive(); }
    t.closest(".opts").querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",o.querySelector("input").checked));
  }
  if(t.id==="f-post"){ S.filter.post=t.value; renderRows(); }
  if(t.id==="h-dec"){ S.draft.decision=t.value; S.dirty=true; keepScroll(); }
});
document.addEventListener("input", e=>{
  const t=e.target;
  if(t.id==="f-q"){ S.filter.q=t.value; renderRows(); }
  if(t.id==="typebox") S.p3.typed=t.value;
  if(t.id==="h-notes"){ S.draft.notes=t.value; if(!S.dirty){ S.dirty=true; const bar=$(".savebar"); if(bar){ bar.querySelector("span").innerHTML="<b>Unsaved changes</b>"; bar.querySelector("button").disabled=false; } } }
});
document.addEventListener("paste", e=>{ if(e.target.id==="typebox"){ e.preventDefault(); toast("Paste is turned off for the typing test."); } });
document.addEventListener("drop", e=>{ if(e.target.id==="typebox") e.preventDefault(); });
document.addEventListener("submit", async e=>{
  e.preventDefault();
  const f=e.target;
  if(f.id==="f-details") startCandidate();
  else if(f.id==="f-pin") pinSubmit();
  else if(f.id==="f-tasks"){
    try{ S.cfg=await hrApi("PUT","settings",{taskEmail:$("#s-email").value.trim()}); toast("Saved"); }
    catch(err){ toast(err.message); }
  }
});
window.addEventListener("beforeunload", e=>{ if(S.dirty){ e.preventDefault(); e.returnValue=""; } });
</script>
</body>
